    :root {

    body { background-color: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 90px; }

    /* Top Announcement Bar */
    .announce-bar { background: #000; border-bottom: 1px solid var(--border); text-align: center; padding: 10px 15px; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }

    /* Header */
    header { sticky: top: 0; z-index: 100; background: rgba(9, 9, 11, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 18px 6%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }

    .header-actions { display: flex; align-items: center; gap: 18px; }
    .cart-trigger { position: relative; cursor: pointer; background: #1a1a20; border: 1px solid var(--border); width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .cart-badge { position: absolute; top: -4px; right: -4px; background: #fff; color: #000; font-size: 10px; font-weight: 800; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    /* Hero Section */
    .hero { position: relative; padding: 70px 6% 50px; text-align: center; background: radial-gradient(circle at 50% 20%, #1c1c24 0%, var(--bg) 70%); }
    .hero-tag { display: inline-block; padding: 6px 14px; border-radius: 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 20px; font-weight: 700; }
    .hero h1 { font-family: 'Syne', sans-serif; font-size: clamp(32px, 7vw, 64px); font-weight: 800; line-height: 1.05; letter-spacing: -1px; margin-bottom: 16px; text-transform: uppercase; }
    .hero p { color: var(--muted); font-size: 15px; max-width: 500px; margin: 0 auto 30px; line-height: 1.6; }

    /* Category Filter Tabs */
    .filter-bar { display: flex; justify-content: center; gap: 12px; padding: 0 6% 30px; flex-wrap: wrap; }
    .filter-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--muted); padding: 10px 22px; border-radius: 30px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 1px; }
    .filter-btn.active, .filter-btn:hover { background: #fff; color: #000; border-color: #fff; }

    /* Product Grid */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; padding: 0 6%; max-width: 1300px; margin: 0 auto; }
    .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: transform 0.3s ease, border-color 0.3s ease; position: relative; display: flex; flex-direction: column; }
